# 👈 NUEVO: archivo completo
name: build-and-push-ecr

on:
  push:
    branches: [main]      # corre cuando llega un commit a main
  workflow_dispatch:      # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  id-token: write         # permite al job pedir el token OIDC a GitHub
  contents: read          # permite hacer checkout del código

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecr-lab-api   # el nombre del repo ECR del paso 1

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}   # la variable del paso 3.2
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}   # <cuenta>.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}                  # SHA del commit
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"